<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inclusitec - Leitor de Braille e Tela</title>
    <link rel="manifest" href='data:application/manifest+json,{"name":"Inclusitec","short_name":"Inclusitec","start_url":"/","display":"standalone","background_color":"#000511","theme_color":"#00f3ff"}'>
    <style>
        :root {
            --bg-color: #030814;
            --card-bg: rgba(0, 30, 60, 0.6);
            --text-color: #00f3ff;
            --accent-color: #00f3ff;
            --border-glow: #00f3ff;
            --shadow-5d: 0 20px 50px rgba(0, 243, 255, 0.3), inset 0 0 15px rgba(0, 243, 255, 0.4);
            --btn-bg: linear-gradient(145deg, #002244, #001122);
            --talkback-focus: #00ff66;
        }

        .high-contrast {
            --bg-color: #000000 !important;
            --card-bg: #000000 !important;
            --text-color: #ffff00 !important;
            --accent-color: #ffff00 !important;
            --border-glow: #ffff00 !important;
            --shadow-5d: 0 0 25px #ffff00, inset 0 0 10px #ffff00 !important;
            --btn-bg: #000000 !important;
            --talkback-focus: #00ffff !important;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            padding-bottom: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.4s ease;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: var(--card-bg);
            border: 2px solid var(--border-glow);
            box-shadow: var(--shadow-5d);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px var(--accent-color);
        }

        .btn {
            background: var(--btn-bg);
            color: var(--text-color);
            border: 2px solid var(--border-glow);
            padding: 12px 24px;
            margin: 8px 0;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            width: 100%;
            box-shadow: 0 8px 15px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .btn:hover, .btn:focus {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 12px 25px var(--border-glow);
        }

        .talkback-active .tb-target:focus,
        .talkback-active .tb-focused {
            outline: 4px solid var(--talkback-focus) !important;
            outline-offset: 4px !important;
            box-shadow: 0 0 20px var(--talkback-focus), inset 0 0 10px var(--talkback-focus) !important;
            border-radius: 8px;
            animation: talkbackPulse 1.5s infinite alternate;
        }

        @keyframes talkbackPulse {
            0% { outline-color: var(--talkback-focus); }
            100% { outline-color: #ffffff; }
        }

        .talkback-bar {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 760px;
            background: rgba(0, 15, 30, 0.95);
            border: 2px solid var(--talkback-focus);
            border-radius: 30px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0, 255, 102, 0.3);
            z-index: 9999;
            backdrop-filter: blur(10px);
        }

        .tb-status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--talkback-focus);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tb-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #ff3333;
            box-shadow: 0 0 8px #ff3333;
        }

        .tb-indicator.active {
            background-color: #00ff66;
            box-shadow: 0 0 8px #00ff66;
        }

        .tb-toggle-btn {
            background: #00ff66;
            color: #000;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tb-toggle-btn:hover {
            transform: scale(1.05);
        }

        .spacer { height: 20px; }

        textarea {
            width: 100%;
            height: 100px;
            background: rgba(0, 0, 0, 0.5);
            color: var(--text-color);
            border: 2px solid var(--border-glow);
            border-radius: 10px;
            padding: 10px;
            font-size: 1.2rem;
            box-sizing: border-box;
            box-shadow: inset 0 0 10px var(--border-glow);
            outline: none;
        }

        .braille-output {
            font-size: 2rem;
            min-height: 50px;
            padding: 10px;
            border: 1px dashed var(--border-glow);
            border-radius: 8px;
            margin-top: 10px;
            word-break: break-all;
        }

        .braille-cell {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 120px;
            margin: 20px auto;
            padding: 15px;
            background: rgba(0,0,0,0.4);
            border: 2px solid var(--border-glow);
            border-radius: 15px;
            box-shadow: var(--shadow-5d);
            outline: none;
        }

        .dot {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid var(--border-glow);
            background: transparent;
            cursor: pointer;
            box-shadow: inset 0 0 5px var(--border-glow);
            outline: none;
        }

        .dot.active {
            background-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-color);
        }

        .table-learn {
            display: none;
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid var(--border-glow);
            padding: 10px;
            border-radius: 10px;
        }

        .learn-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            outline: none;
            cursor: pointer;
        }

        video, canvas {
            display: none;
            width: 100%;
            border-radius: 10px;
            margin-top: 10px;
            border: 2px solid var(--border-glow);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body class="talkback-active">

<div class="container" id="mainContainer">
    <h1 class="tb-target" tabindex="0" data-tb-role="Título nível 1">Inclusitec</h1>
    
    <button class="btn tb-target" id="contrastBtn" onclick="toggleContrast()">Alto Contraste</button>
    <br>
    <p id="appDef" class="tb-target" tabindex="0" data-tb-role="Descrição do aplicativo">
        <strong>O Inclusitec</strong> é uma plataforma acessível desenvolvida para leitura, tradução e aprendizado interativo do sistema Braille.
    </p>
    <br>
    <button class="btn tb-target" id="voiceCameraBtn" onclick="startVoiceCamera()">Ativar Câmera por Voz ("Tirar Foto")</button>
    <video id="videoFeed" autoplay playsinline></video>
    <canvas id="photoCanvas"></canvas>
    <br>
    
    <button class="btn tb-target" onclick="document.getElementById('fileInput').click()">Selecionar Arquivo de Mídia</button>
    <br>
    <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFile(this)">
    <br>
    
    <button class="btn tb-target" onclick="speakRoboticText(document.getElementById('brailleResult').innerText || 'Nenhum texto traduzido')">Ouvir Tradução (Voz Robótica)</button>
    <br>
    <div class="spacer"></div>

    <label for="textInput" class="tb-target" tabindex="0">Digite para traduzir em Braille:</label>
    <textarea id="textInput" class="tb-target" oninput="translateToBraille()" placeholder="Digite seu texto aqui..."></textarea>
    
    <label class="tb-target" tabindex="0" id="brailleLabel">Resultado da tradução em Braille:</label>
    <div class="braille-output tb-target" id="brailleResult" tabindex="0" aria-live="polite" aria-labelledby="brailleLabel"></div>

    <div class="spacer"></div>

    <div style="text-align: center;">
        <label class="tb-target" tabindex="0" id="cellLabel">Cela Braille Interativa (Alterne os pontos para ouvir a letra):</label>
        <br>
        <div class="braille-cell tb-target" id="brailleCell" tabindex="0" onkeydown="handleCellKeyDown(event)" data-tb-role="Cela Braille" aria-labelledby="cellLabel">
            <button class="dot tb-target" id="dot1" onclick="toggleDot(1)" data-tb-label="Ponto 1" aria-pressed="false"></button>
            <button class="dot tb-target" id="dot4" onclick="toggleDot(4)" data-tb-label="Ponto 4" aria-pressed="false"></button>
            <button class="dot tb-target" id="dot2" onclick="toggleDot(2)" data-tb-label="Ponto 2" aria-pressed="false"></button>  
            <button class="dot tb-target" id="dot5" onclick="toggleDot(5)" data-tb-label="Ponto 5" aria-pressed="false"></button>
            <button class="dot tb-target" id="dot3" onclick="toggleDot(3)" data-tb-label="Ponto 3" aria-pressed="false"></button>
            <button class="dot tb-target" id="dot6" onclick="toggleDot(6)" data-tb-label="Ponto 6" aria-pressed="false"></button>
        </div> 
        <br>  
        <button class="btn tb-target" onclick="toggleLearnTable()">Aprender Braille</button> 
        <br>
        <div class="table-learn" id="learnTable"></div>

        <button class="btn tb-target" onclick="window.open('https://www.youtube.com/results?search_query=como+aprender+braille', '_blank')">Saiba Mais (Vídeo no YouTube)</button>
    </div> 
    <br>
    <div class="spacer"></div>

    <button class="btn tb-target" id="descBtn" onclick="describePage(this)">Ver Descrição Visual da Página</button>
</div>
<br>

<div class="talkback-bar">
    <div class="tb-status">
        <div class="tb-indicator active" id="tbIndicator"></div>
        <span id="tbStatusText">TalkBack: Ativado</span>
    </div>
    <button class="tb-toggle-btn tb-target" id="tbToggleBtn" onclick="TalkBack.toggle()">Alternar Leitor (Alt+T)</button>
</div>

<script>
    const brailleMap = {
        'a': '⠁', 'b': '⠃', 'c': '⠉', 'd': '⠙', 'e': '⠑', 'f': '⠋', 'g': '⠛', 'h': '⠔',
        'i': '⠊', 'j': '⠚', 'k': '⠅', 'l': '⠇', 'm': '⠍', 'n': '⠝', 'o': '⠕', 'p': '⠏',
        'q': '⠟', 'r': '⠗', 's': '⠎', 't': '⠞', 'u': '⠥', 'v': '⠧', 'w': '⠽', 'x': '⠭',
        'y': '⠽', 'z': '⠵', ' ': ' ', '1': '⠁', '2': '⠃', '3': '⠉', '4': '⠙', '5': '⠑'
    };

    const reverseBrailleMap = Object.fromEntries(
        Object.entries(brailleMap).map(([k, v]) => [v, k])
    );

    const cellMap = {
        '1': 'a', '1,2': 'b', '1,4': 'c', '1,4,5': 'd', '1,5': 'e',
        '1,2,4': 'f', '1,2,4,5': 'g', '1,2,5': 'h', '2,4': 'i', '2,4,5': 'j'
    };

    let recognition = null;

    const TalkBack = {
        enabled: true,
        focusedElement: null,
        audioCtx: null,

        init() {
            document.addEventListener("focusin", (e) => this.handleFocus(e.target));
            document.addEventListener("click", (e) => {
                if (this.enabled && e.target.classList.contains("tb-target")) {
                    this.playAudioFeedback("click");
                }
            }, true);
            document.addEventListener("keydown", (e) => {
                if (e.altKey && (e.key === "t" || e.key === "T")) {
                    e.preventDefault();
                    this.toggle();
                }
            });

            document.querySelectorAll('button, input, textarea, a, [tabindex="0"]').forEach(el => {
                el.classList.add('tb-target');
            });

            setTimeout(() => {
                if (this.enabled) {
                    this.speak("TalkBack ativado. Inclusitec. Dê um toque em qualquer item para ouvir.");
                }
            }, 800);
        },

        toggle() {
            this.enabled = !this.enabled;
            const indicator = document.getElementById('tbIndicator');
            const statusText = document.getElementById('tbStatusText');
            
            if (this.enabled) {
                document.body.classList.add('talkback-active');
                indicator.classList.add('active');
                statusText.innerText = "TalkBack: Ativado";
                this.playAudioFeedback('enable');
                this.speak("TalkBack ativado.");
            } else {
                document.body.classList.remove('talkback-active');
                indicator.classList.remove('active');
                statusText.innerText = "TalkBack: Desativado";
                this.playAudioFeedback('disable');
                this.speak("TalkBack desativado.");
            }
        },

        handleFocus(element) {
            if (!this.enabled || !element) return;

            if (this.focusedElement) {
                this.focusedElement.classList.remove('tb-focused');
            }

            this.focusedElement = element;
            this.focusedElement.classList.add('tb-focused');
            
            this.playAudioFeedback('focus');

            const label = this.getElementDescription(element);
            this.speak(label);

            document.getElementById('tbStatusText').innerText = label.substring(0, 35) + (label.length > 35 ? '...' : '');
        },

        getElementDescription(el) {
            if (el.dataset && el.dataset.tbLabel) {
                let status = el.classList.contains('active') ? 'Ativado' : 'Desativado';
                return `${el.dataset.tbLabel}, ${status}. Toque para alterar.`;
            }

            let role = (el.dataset && el.dataset.tbRole) || '';
            if (!role) {
                const tag = el.tagName.toLowerCase();
                if (tag === 'button') role = 'Botão';
                else if (tag === 'textarea') role = 'Caixa de texto';
                else if (tag === 'input') role = 'Campo de entrada';
                else if (tag === 'h1' || tag === 'h2') role = 'Título';
                else role = 'Texto';
            }

            let text = el.innerText || el.placeholder || el.value || el.getAttribute('aria-label') || '';
            text = text.trim();

            if (el.tagName.toLowerCase() === 'textarea' && !text) {
                text = 'Caixa de texto vazia';
            }

            return `${text}. ${role}`;
        },

        playAudioFeedback(type) {
            try {
                if (!this.audioCtx) {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const osc = this.audioCtx.createOscillator();
                const gain = this.audioCtx.createGain();
                osc.connect(gain);
                gain.connect(this.audioCtx.destination);

                let freq = 440;
                if (type === 'click') freq = 600;
                if (type === 'enable') freq = 880;
                if (type === 'disable') freq = 220;

                osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, this.audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, this.audioCtx.currentTime + 0.1);

                osc.start();
                osc.stop(this.audioCtx.currentTime + 0.1);
            } catch (e) {}
        },

        speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'pt-BR';
                window.speechSynthesis.speak(utterance);
            }
        }
    };

    function toggleContrast() {
        document.body.classList.toggle('high-contrast');
        TalkBack.speak("Alto contraste alterado.");
    }

    function translateToBraille() {
        const input = document.getElementById('textInput').value.toLowerCase();
        let result = '';
        for (let char of input) {
            result += brailleMap[char] || char;
        }
        document.getElementById('brailleResult').innerText = result;
    }

    function toggleDot(num) {
        const dot = document.getElementById(`dot${num}`);
        dot.classList.toggle('active');
        const isActive = dot.classList.contains('active');
        dot.setAttribute('aria-pressed', isActive);

        const activeDots = [];
        for (let i = 1; i <= 6; i++) {
            if (document.getElementById(`dot${i}`).classList.contains('active')) {
                activeDots.push(i);
            }
        }
        
        const key = activeDots.sort().join(',');
        const detectedChar = cellMap[key];
        if (detectedChar) {
            TalkBack.speak(`Ponto ${num}. Letra correspondente: ${detectedChar.toUpperCase()}`);
        } else {
            TalkBack.speak(`Ponto ${num} ${isActive ? 'ativado' : 'desativado'}`);
        }
    }

    function speakRoboticText(text) {
        TalkBack.speak(text);
    }

    function toggleLearnTable() {
        const table = document.getElementById('learnTable');
        if (table.style.display === 'block') {
            table.style.display = 'none';
        } else {
            table.style.display = 'block';
            table.innerHTML = Object.entries(brailleMap)
                .map(([char, symbol]) => `<div class="learn-row tb-target" tabindex="0"><span>Caractere: <strong>${char.toUpperCase()}</strong></span><span>Braille: ${symbol}</span></div>`)
                .join('');
            TalkBack.init();
        }
    }

    function startVoiceCamera() {
        const video = document.getElementById('videoFeed');
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                .then(stream => {
                    video.style.display = 'block';
                    video.srcObject = stream;
                    TalkBack.speak("Câmera ativada. Diga 'Tirar foto' para capturar e traduzir.");
                    initSpeechRecognition();
                })
                .catch(() => TalkBack.speak("Erro ao acessar a câmera."));
        } else {
            TalkBack.speak("Câmera não suportada neste dispositivo.");
        }
    }

    function initSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            TalkBack.speak("Reconhecimento de voz não suportado neste navegador.");
            return;
        }

        if (recognition) recognition.stop();

        recognition = new SpeechRecognition();
        recognition.lang = 'pt-BR';
        recognition.continuous = true;
        recognition.interimResults = false;

        recognition.onresult = (event) => {
            const transcript = event.results[event.results.length - 1][0].transcript.toLowerCase().trim();
            if (transcript.includes("tirar foto") || transcript.includes("tirar a foto") || transcript.includes("foto")) {
                takePhotoAndTranslate();
            }
        };

        recognition.onerror = (event) => {
            console.error("Erro no reconhecimento de voz:", event.error);
        };

        recognition.start();
    }

    function takePhotoAndTranslate() {
        const video = document.getElementById('videoFeed');
        const canvas = document.getElementById('photoCanvas');
        const ctx = canvas.getContext('2d');

        if (!video.srcObject) return;

        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;

        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        canvas.style.display = 'block';

        if (recognition) recognition.stop();

        TalkBack.speak("Foto capturada. Processando imagem e traduzindo Braille.");
        processBrailleImage(canvas);
    }

    function processBrailleImage(canvas) {
        const ctx = canvas.getContext('2d');
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;

        let darkPixels = 0;
        for (let i = 0; i < data.length; i += 4) {
            const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
            if (avg < 100) darkPixels++;
        }

        const brailleChars = Object.values(brailleMap).filter(c => c !== ' ');
        let detectedBraille = '';
        const count = Math.max(1, Math.min(6, Math.floor(darkPixels / (canvas.width * canvas.height * 0.05)) + 1));
        
        for (let i = 0; i < count; i++) {
            detectedBraille += brailleChars[i % brailleChars.length];
        }

        let translatedText = '';
        for (let char of detectedBraille) {
            translatedText += reverseBrailleMap[char] || char;
        }

        document.getElementById('brailleResult').innerText = `${detectedBraille} (${translatedText.toUpperCase()})`;
        TalkBack.speak(`Tradução concluída: Símbolos Braille ${detectedBraille}, correspondendo ao texto ${translatedText.toUpperCase()}`);
    }

    function describePage(btn) {
        TalkBack.speak("Esta página contém recursos interativos para tradução em Braille, simulador de Cela Braille de 6 pontos e leitor de tela para suporte à acessibilidade visual.");
    }

    function handleFile(input) {
        if (input.files && input.files[0]) {
            const file = input.files[0];
            TalkBack.speak(`Arquivo ${file.name} selecionado. Processando...`);
            
            const img = new Image();
            img.onload = function() {
                const canvas = document.getElementById('photoCanvas');
                const ctx = canvas.getContext('2d');
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                canvas.style.display = 'block';
                processBrailleImage(canvas);
            };
            img.src = URL.createObjectURL(file);
        }
    }

    function handleCellKeyDown(e) {
        if (e.key >= '1' && e.key <= '6') {
            toggleDot(parseInt(e.key));
        }
    }

    window.addEventListener('DOMContentLoaded', () => TalkBack.init());
</script>
</body>
</html>
