<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Símbolo de Acessibilidade</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #0052cc 0%, #00227b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: relative;
        }

        /* Ambient glowing background overlay for "azul bic brilhante" */
        .bg-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(0, 102, 255, 0.6) 0%, rgba(0, 20, 80, 0.9) 80%);
            z-index: 1;
        }

        /* Container for 4D/3D symbol */
        .symbol-container {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0px 25px 30px rgba(0, 0, 0, 0.7));
            animation: float 4s ease-in-out infinite;
        }

        /* 3D/4D styled Disability Symbol via SVG */
        .symbol-svg {
            width: min(320px, 70vw);
            height: min(320px, 70vw);
        }

        /* Floating 4D animation effect */
        @keyframes float {
            0% {
                transform: translateY(0px) rotateX(10deg) rotateY(-5deg);
            }
            50% {
                transform: translateY(-20px) rotateX(-5deg) rotateY(10deg);
            }
            100% {
                transform: translateY(0px) rotateX(10deg) rotateY(-5deg);
            }
        }

        /* Button container and style */
        .button-container {
            position: absolute;
            bottom: 40px;
            z-index: 10;
        }

        .btn-desc {
            background: #ffffff;
            color: #00227b;
            border: 3px solid #001144;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            outline: none;
        }

        .btn-desc:hover {
            background: #e6f0ff;
            transform: scale(1.05);
            box-shadow: 0 12px 25px rgba(0,0,0,0.5);
        }

        .btn-desc:active {
            transform: scale(0.98);
        }

        .speaker-icon {
            width: 24px;
            height: 24px;
            fill: #00227b;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <main class="symbol-container">
        <!-- SVG representing a 4D/3D metallic styled wheelchair accessibility symbol in light red with black outline -->
        <svg class="symbol-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 3D Lighting and Gradient for Light Red Object -->
                <radialGradient id="red3d" cx="35%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#ff8888" />
                    <stop offset="40%" stop-color="#ff4d4d" />
                    <stop offset="85%" stop-color="#cc0000" />
                    <stop offset="100%" stop-color="#800000" />
                </radialGradient>
                
                <!-- 3D bevel / stroke glow -->
                <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="4" dy="8" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
                </filter>
            </defs>

            <g filter="url(#shadow3d)">
                <!-- Head -->
                <circle cx="100" cy="42" r="14" fill="url(#red3d)" stroke="#000000" stroke-width="3.5" />

                <!-- Torso / Arms / Chair Structure -->
                <!-- Backrest and body -->
                <path d="M 95,60 
                         L 115,60 
                         C 118,60 120,62 120,65
                         L 112,95 
                         L 135,95 
                         C 138,95 140,97 140,100
                         L 140,105
                         C 140,108 138,110 135,110
                         L 105,110
                         C 102,110 100,108 100,105
                         L 100,80
                         L 85,80
                         C 82,80 80,78 80,75
                         L 80,70
                         C 80,67 82,60 85,60 
                         Z" 
                      fill="url(#red3d)" stroke="#000000" stroke-width="3.5" stroke-linejoin="round" />

                <!-- Wheel Frame (Large Wheel) -->
                <path d="M 75,100 
                         A 32,32 0 1,0 125,135" 
                      fill="none" stroke="url(#red3d)" stroke-width="12" stroke-linecap="round" />
                
                <path d="M 75,100 
                         A 32,32 0 1,0 125,135" 
                      fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round" />

                <!-- Inner Wheel Accent for 3D Volume -->
                <circle cx="95" cy="125" r="8" fill="url(#red3d)" stroke="#000000" stroke-width="2.5" />
            </g>
        </svg>
    </main>

    <div class="button-container">
        <button class="btn-desc" onclick="falarDescricao()" onkeydown="checarEnter(event)">
            <svg class="speaker-icon" viewBox="0 0 24 24">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
            Ver descrição
        </button>
    </div>

    <script>
        function falarDescricao() {
            if (window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
                return;
            }

            const textoDescricao = "Descrição visual da página: O fundo da tela é totalmente preenchido por um azul bic vibrante e brilhante com gradiente luminoso. Centralizado na tela, flutua em efeito tridimensional quatro D o símbolo internacional de acessibilidade e pessoa com deficiência. O símbolo está renderizado na cor vermelho claro, com volume, iluminação em degradê e um contorno preto bem definido. Na parte inferior da tela, há um botão arredondado com a inscrição Ver Descrição.";

            const utterance = new SpeechSynthesisUtterance(textoDescricao);
            utterance.lang = 'pt-BR';
            
            // Adjust rate and pitch to create a clear, synthetic/robotic tone
            utterance.rate = 0.95;  // slightly measured pace
            utterance.pitch = 0.8;  // slightly lower pitch for a mechanical feel

            // Try to pick a Portuguese voice if available
            const voices = window.speechSynthesis.getVoices();
            const ptVoice = voices.find(v => v.lang.includes('pt-BR') || v.lang.includes('pt'));
            if (ptVoice) {
                utterance.voice = ptVoice;
            }

            window.speechSynthesis.speak(utterance);
        }

        function checarEnter(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                falarDescricao();
            }
        }

        // Preload voices
        if (typeof speechSynthesis !== 'undefined') {
            speechSynthesis.onvoiceschanged = () => {
                speechSynthesis.getVoices();
            };
        }
    </script>
</body>
</html>
